    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2CC8DC"/>
      <stop offset="1" stop-color="#0A6585"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#tile)"/>
  <circle cx="54" cy="54" r="29" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="76" y1="76" x2="100" y2="100" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <rect x="40" y="41" width="28" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="40" y="58" width="18" height="9" rx="4.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
